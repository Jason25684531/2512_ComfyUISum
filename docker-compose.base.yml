# ============================================
# TWCC Base VM 專用 - 常駐基礎服務
# ============================================
# 用途：TWCC Base VM，包含 nginx、Flask API、Redis 與 MySQL
# 不包含 Worker、ComfyUI、Ngrok（Worker 在 GPU VM 上直接運行）
#
# 使用方式：
#   docker compose -f docker-compose.base.yml --env-file .env.twcc up -d
# 此檔即為 TWCC Base VM 的 canonical compose entry；nginx 轉送至 Flask API。
#
# ============================================

services:
  # =========================================
  # Nginx 反向代理 + 靜態前端
  # =========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: studio-nginx
    ports:
      - "80:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx/nginx.twcc.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - studio-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # =========================================
  # Backend API (Flask)
  # =========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: studio-backend
    ports:
      - "5000:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_INTERNAL_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STUDIO_ENV_FILE=.env.selected
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - COMFYUI_HOST=${COMFYUI_HOST:-127.0.0.1}
      - COMFYUI_PORT=${COMFYUI_PORT:-8188}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-studio}
      - DB_USER=${DB_USER:-studio}
      - DB_PASSWORD=${DB_PASSWORD}
      - JOB_OBSERVABILITY_ENABLED=true
      # TWCC 雲端專用
      - PROXY_FIX=${PROXY_FIX:-true}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - studio-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - ${ENV_CONTRACT_FILE:-./.env.twcc}:/app/.env.selected:ro
      - ./frontend:/app/frontend:ro
      - ${STORAGE_OUTPUT_DIR:-./storage/outputs}:/app/storage/outputs
      - ${LOG_DIR:-./logs}:/app/logs

  # =========================================
  # Redis 服務
  # =========================================
  redis:
    image: redis:7.2
    container_name: studio-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --bind
      - 0.0.0.0
      - --protected-mode
      - no
    volumes:
      - ${REDIS_DATA_PATH:-./redis_data}:/data
    restart: unless-stopped
    networks:
      - studio-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: studio-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-studio}
      MYSQL_USER: ${DB_USER:-studio}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${MYSQL_DATA_PATH:-./mysql_data}:/var/lib/mysql
    restart: unless-stopped
    networks:
      - studio-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  # MySQL is an active TWCC Base VM service; MYSQL_DATA_PATH persists its database state.

networks:
  studio-net:
    driver: bridge
