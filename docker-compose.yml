# ============================================
# 本地 canonical compose（Win ComfyUI + WSL2 Docker 服務層）
# 使用方式：docker compose -f docker-compose.yml --env-file .env.local up -d
# 本地環境邊界：docker-compose.yml + .env.local + ComfyUIworkflow/
#
# ComfyUI 在 Windows 原生執行（不在此 compose 內），
# worker 透過 host.docker.internal 連接。
# ============================================
version: '3.8'

services:
  # =========================================
  # 1. Redis 服務
  # =========================================
  redis:
    image: redis:7.2
    container_name: studio-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
    volumes:
      - ./redis_data:/data
    restart: always
    networks:
      - studio-net

  mysql:
    image: mysql:8.4
    container_name: studio-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-studio}
      MYSQL_USER: ${DB_USER:-studio}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: always
    networks:
      - studio-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  # MySQL is an active local service; ./mysql_data persists its database state.

  # =========================================
  # 2. Backend API 服務
  # =========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: studio-backend
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STUDIO_ENV_FILE=.env.selected
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-studio}
      - DB_USER=${DB_USER:-studio}
      - DB_PASSWORD=${DB_PASSWORD}
      - JOB_OBSERVABILITY_ENABLED=true
      # Set a stable value per Worker instance in production; hostname is the local fallback.
      - WORKER_ID=${WORKER_ID:-}
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: always
    networks:
      - studio-net
    working_dir: /app
    volumes:
      - ${ENV_CONTRACT_FILE:-./.env.local}:/app/.env.selected:ro
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./ComfyUIworkflow:/app/ComfyUIworkflow:ro
      - ./ComfyUIworkflow_api:/app/ComfyUIworkflow_api:ro
      - ./frontend:/app/frontend:ro

  # =========================================
  # 4. Worker 服務
  # ComfyUI 在 Windows 原生執行，worker 透過
  # host.docker.internal 連接（Docker Desktop 官方解析方式）
  # =========================================
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: studio-worker
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STUDIO_ENV_FILE=.env.selected
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-studio}
      - DB_USER=${DB_USER:-studio}
      - DB_PASSWORD=${DB_PASSWORD}
      - JOB_OBSERVABILITY_ENABLED=true
      # Keep this stable per Worker instance; do not use a process-random ID.
      - WORKER_ID=${WORKER_ID:-}

      # ComfyUI 在 Windows 原生執行，容器內必須固定使用 host.docker.internal
      # 不讀取 .env 變數，避免 .env 中的 127.0.0.1 覆蓋 Docker 正確路由
      - COMFY_HOST=host.docker.internal
      - COMFY_PORT=${COMFY_PORT:-8188}
      - COMFYUI_HOST=host.docker.internal
      - COMFYUI_SERVER_URL=http://host.docker.internal:${COMFY_PORT:-8188}
      # Worker 跑在 Linux 容器但 ComfyUI 在 Windows，model 路徑用反斜線格式
      - COMFYUI_RUNTIME_PROFILE=windows

      - COMFYUI_INPUT_DIR=/worker/storage/inputs
      - COMFYUI_OUTPUT_DIR=/worker/storage/outputs

      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-3600}
      - COMFY_POLLING_INTERVAL=${COMFY_POLLING_INTERVAL:-0.5}

    depends_on:
      redis:
        condition: service_started
    restart: always
    networks:
      - studio-net
    volumes:
      - ${ENV_CONTRACT_FILE:-./.env.local}:/worker/.env.selected:ro
      - ./storage:/worker/storage
      - ./logs:/worker/logs
      - ./ComfyUIworkflow:/worker/ComfyUIworkflow:ro
      - ./ComfyUIworkflow_api:/ComfyUIworkflow_api:ro

networks:
  studio-net:
    driver: bridge
